[workspace]
members = ["crates/bridge-protocol", "crates/omablue-helper"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/jamielmccormick/omablue"
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
