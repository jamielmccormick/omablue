name: Bug report
description: Report a reproducible OmaBlue defect without personal message data.
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include message bodies, contacts, attachments, credentials, Tailnet names, or private addresses.
  - type: input
    id: version
    attributes:
      label: OmaBlue version
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Omarchy, macOS, and imsg versions. Do not include private hostnames.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I removed all personal message and private network data.
          required: true
