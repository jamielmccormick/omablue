name: Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  repository:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Validate repository
        run: ./scripts/validate.sh

  macos-feasibility-harness:
    runs-on: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Build ad-hoc signed feasibility app
        run: OMABLUE_INCLUDE_IMSG=1 ./apps/mac-bridge/feasibility/build.sh

      - name: Inspect bundle signatures and entitlements
        run: |
          app="apps/mac-bridge/feasibility/dist/OmaBlue Feasibility.app"
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign --display --entitlements :- "$app/Contents/MacOS/OmaBlueFeasibilityAgent"
          plutil -lint "$app/Contents/Info.plist"
          plutil -lint "$app/Contents/Library/LaunchAgents/com.jamielmccormick.omablue.feasibility-agent.plist"
